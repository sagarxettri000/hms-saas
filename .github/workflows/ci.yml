name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @hms/shared
      - name: Generate Prisma client
        run: npm run db:generate -w @hms/server
      - name: Typecheck + test
        # Unit tests call JwtStrategy.secretOrKey() which requires these vars.
        # Using non-production dev placeholder tokens for the test job only.
        env:
          JWT_ACCESS_SECRET: dev-access-secret-placeholder-long-enough
          JWT_REFRESH_SECRET: dev-refresh-secret-placeholder-long-enough
        run: |
          npm run typecheck -w @hms/server
          npm run typecheck -w @hms/web
          npm run test -w @hms/server
          npm run test -w @hms/web
      - name: Audit production dependencies (non-blocking)
        # Reports advisories without failing the build. Current findings are
        # moderate (NestJS 10 / Express 4 stack); the only npm audit fix is a
        # BREAKING major upgrade to NestJS 12 + Express 5 (tech-debt tracked separately).
        run: npm audit --omit=dev --audit-level=high || true
      - name: Apply migrations against test DB (detects drift)
        run: npx prisma migrate deploy
        working-directory: apps/server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hms_test
